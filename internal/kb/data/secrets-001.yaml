id: secrets-001
title: Hardcoded Secrets in Source Code
description: |
  Hardcoding secrets like API keys, passwords, or tokens directly in source code
  creates severe security risks as these credentials are exposed in version control,
  logs, and compiled binaries. Attackers gaining access to the codebase can extract
  these secrets to compromise external services, databases, or user accounts.
code_patterns:
  - const API_KEY = "sk-1234567890abcdef"
  - password = "SuperSecret123!"
  - AWS_SECRET_ACCESS_KEY = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  - private static final String DB_PASSWORD = "admin123"
  - STRIPE_SECRET_KEY = "sk_live_4eC39HqLyjWDarjtT1zdp7dc"
schema_version: 1
